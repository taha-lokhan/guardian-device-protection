# Mosquitto TLS configuration for Guardian
# Place this file at /etc/mosquitto/conf.d/tls.conf on your VPS
# Then: sudo systemctl restart mosquitto
#
# --- Generate certs (run once on VPS) ---
#
# mkdir -p /etc/guardian/certs && cd /etc/guardian/certs
#
# 1. CA key + self-signed cert
# openssl req -new -x509 -days 3650 -nodes \
#   -keyout ca.key -out ca.crt \
#   -subj "/CN=GuardianCA"
#
# 2. Server key + CSR + sign with CA
# openssl req -new -nodes \
#   -keyout server.key -out server.csr \
#   -subj "/CN=YOUR_VPS_HOSTNAME_OR_IP"
# openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key \
#   -CAcreateserial -out server.crt -days 3650
#
# 3. Fix permissions
# chmod 640 /etc/guardian/certs/*.key
# chown mosquitto:mosquitto /etc/guardian/certs/*.key
#
# Agents need a copy of ca.crt only (not the server key).
# Copy ca.crt to each device running an agent:
#   scp /etc/guardian/certs/ca.crt user@device:/etc/guardian/certs/ca.crt
#
# --- Optional: mutual TLS (require client certs) ---
# To require agents to authenticate with a client cert, uncomment:
#   require_certificate true
# Then generate a client cert per device using the same CA and set:
#   MQTT_CLIENT_CERT + MQTT_CLIENT_KEY in each agent's .env

# Disable plain listener, TLS only
# (comment out if you need plain 1883 locally for debugging)
# listener 1883 localhost

# TLS listener
listener 8883
protocol mqtt

cafile   /etc/guardian/certs/ca.crt
certfile /etc/guardian/certs/server.crt
keyfile  /etc/guardian/certs/server.key

# TLS version floor — disallow TLS 1.0 and 1.1
tls_version tlsv1.2

# Uncomment to require client certificate authentication (mutual TLS):
# require_certificate true
# use_identity_as_username false
