name: Security regression tests

on:
  pull_request:
  push:
    branches:
      - main
      - "security/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay-command-boundary:
    name: Relay command allowlist tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install relay and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r vps-setup/requirements.txt pytest

      - name: Compile all Python agents
        run: python -m compileall -q vps-setup windows-agent mac-agent tests

      - name: Validate installer shell syntax
        run: bash -n vps-setup/setup_vps.sh mac-agent/install_mac.sh

      - name: Run isolated security regression tests
        run: pytest -q tests/

  android-command-auth:
    name: Android Ed25519 verifier tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Run Android verifier tests and assemble
        run: gradle -p android-app testDebugUnitTest assembleDebug
