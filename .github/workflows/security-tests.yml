name: Security regression tests

on:
  pull_request:
  push:
    branches:
      - main
      - "security/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay-command-boundary:
    name: Relay command allowlist tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install relay and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r vps-setup/requirements.txt pytest

      - name: Run isolated security regression tests
        run: pytest -q tests/test_generic_command_allowlist.py
