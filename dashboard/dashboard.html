<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Guardian Dashboard v2</title>
<style>
  :root {
    --bg:#0d1117;--surface:#161b22;--border:#30363d;
    --text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;
    --danger:#f85149;--warn:#d29922;--ok:#3fb950;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
  h1{font-size:1.4rem;margin-bottom:20px;display:flex;align-items:center;gap:10px}
  .version-badge{background:var(--accent);color:#000;font-size:.65rem;padding:2px 8px;border-radius:20px;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px}
  .card h2{font-size:.9rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:14px}
  .device-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .device-name{font-weight:700;font-size:1rem}
  .badge{font-size:.7rem;padding:2px 8px;border-radius:20px;font-weight:600}
  .badge-online{background:#1a3a1f;color:var(--ok)}
  .badge-offline{background:#3a1a1a;color:var(--danger)}
  .info-row{display:flex;justify-content:space-between;font-size:.8rem;padding:4px 0;border-bottom:1px solid var(--border);color:var(--muted)}
  .info-row:last-child{border-bottom:none}
  .info-row span:last-child{color:var(--text)}
  .btn{display:inline-block;padding:8px 16px;border-radius:6px;border:none;cursor:pointer;font-size:.82rem;font-weight:600;transition:opacity .15s}
  .btn:hover{opacity:.8}
  .btn-primary{background:var(--accent);color:#000}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-warn{background:var(--warn);color:#000}
  .btn-muted{background:var(--border);color:var(--text)}
  .btn-ok{background:var(--ok);color:#000}
  .btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .nuke-panel{background:#1a0a0a;border:1px solid var(--danger);border-radius:10px;padding:20px;margin-top:16px}
  .nuke-panel h2{color:var(--danger)}
  .countdown{font-size:2.5rem;font-weight:700;color:var(--danger);text-align:center;margin:12px 0;font-variant-numeric:tabular-nums}
  .countdown-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:10px}
  .countdown-fill{height:100%;background:var(--danger);transition:width 1s linear}
  .auth-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100}
  .auth-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:32px;width:320px}
  .auth-box h2{margin-bottom:16px}
  .auth-box input{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.9rem;margin-bottom:10px}
  .auth-box .err{color:var(--danger);font-size:.8rem;margin-top:6px}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:200}
  .modal-overlay.open{display:flex}
  .modal{background:var(--surface);border:1px solid var(--danger);border-radius:12px;padding:32px;width:360px}
  .modal h2{color:var(--danger);margin-bottom:14px}
  .modal input{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);margin-bottom:10px;font-size:.9rem}
  .modal .step-label{font-size:.8rem;color:var(--muted);margin-bottom:6px}
  .modal .err{color:var(--danger);font-size:.8rem;margin:6px 0}
  #toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 20px;font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
  #toast.show{opacity:1}
</style>
</head>
<body>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-box">
    <h2>🔐 Guardian v2</h2>
    <input type="password" id="authPassword" placeholder="Master password" />
    <input type="text"     id="authTotp"     placeholder="TOTP code (6 digits)" maxlength="6" />
    <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Unlock</button>
    <div class="err" id="authErr"></div>
  </div>
</div>

<div class="modal-overlay" id="nukeModal">
  <div class="modal">
    <h2>🔥 Nuke Device</h2>
    <div id="nukeStep1">
      <div class="step-label">Step 1 of 3 — Enter nuke passphrase</div>
      <input type="password" id="nukePassphrase" placeholder="Nuke passphrase" />
      <button class="btn btn-danger" onclick="nukeStep(1)">Next →</button>
    </div>
    <div id="nukeStep2" style="display:none">
      <div class="step-label">Step 2 of 3 — Type <strong>NUKE</strong> to confirm</div>
      <input type="text" id="nukeConfirm" placeholder="Type: NUKE" />
      <button class="btn btn-danger" onclick="nukeStep(2)">Next →</button>
    </div>
    <div id="nukeStep3" style="display:none">
      <div class="step-label">Step 3 of 3 — Enter TOTP code</div>
      <input type="text" id="nukeTotp" placeholder="6-digit TOTP" maxlength="6" />
      <button class="btn btn-danger" onclick="nukeStep(3)">🔥 ARM NUKE</button>
    </div>
    <div class="err" id="nukeErr"></div>
    <button class="btn btn-muted" style="margin-top:12px;width:100%" onclick="closeNukeModal()">Cancel</button>
  </div>
</div>

<h1>🛡️ Guardian Dashboard <span class="version-badge">v2.0</span></h1>
<div class="grid" id="deviceGrid"><div class="card" style="color:var(--muted)">Loading…</div></div>
<div id="toast"></div>

<script>
const API="";
let authToken="", nukeTargetDevice="", nukeCountdowns={};

async function doLogin(){
  const pass=document.getElementById("authPassword").value;
  const totp=document.getElementById("authTotp").value;
  if(!pass||!totp){document.getElementById("authErr").textContent="Fill all fields";return;}
  authToken=`${pass}:${totp}`;
  const res=await apiFetch("/devices");
  if(res.ok){document.getElementById("authOverlay").style.display="none";startDashboard();}
  else{document.getElementById("authErr").textContent="Invalid credentials";authToken="";}
}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&document.getElementById("authOverlay").style.display!=="none")doLogin();});

async function apiFetch(path,method="GET",body=null){
  const opts={method,headers:{"Authorization":`Bearer ${authToken}`,"Content-Type":"application/json"}};
  if(body)opts.body=JSON.stringify(body);
  return fetch(API+path,opts);
}
async function sendCommand(deviceId,command,params={}){
  const res=await apiFetch("/command","POST",{device_id:deviceId,command,params});
  const data=await res.json();
  toast(res.ok?`✅ ${command} sent to ${deviceId}`:`❌ ${data.detail}`,res.ok?"ok":"err");
}

function startDashboard(){loadDevices();setInterval(loadDevices,10000);}
async function loadDevices(){
  const res=await apiFetch("/devices");
  if(!res.ok)return;
  const{devices}=await res.json();
  renderDevices(devices);
  devices.forEach(d=>checkNukeStatus(d.device_id));
}

function renderDevices(devices){
  const grid=document.getElementById("deviceGrid");
  if(!devices.length){grid.innerHTML='<div class="card" style="color:var(--muted)">No devices.</div>';return;}
  grid.innerHTML=devices.map(d=>deviceCard(d)).join("");
}
function deviceCard(d){
  const now=Date.now();
  const lastSeen=d.last_seen?new Date(d.last_seen):null;
  const online=lastSeen&&(now-lastSeen.getTime())<120000;
  const lastSeenStr=lastSeen?lastSeen.toLocaleTimeString():"never";
  const nukeActive=nukeCountdowns[d.device_id]?.active;
  return `<div class="card" id="card-${d.device_id}">
    <div class="device-header">
      <span class="device-name">${d.device_id}</span>
      <span class="badge ${online?"badge-online":"badge-offline'}">${online?"ONLINE":"OFFLINE"}</span>
    </div>
    <div class="info-row"><span>Platform</span><span>${d.platform||"—"}</span></div>
    <div class="info-row"><span>OS</span><span>${d.os_version||"—"}</span></div>
    <div class="info-row"><span>Hostname</span><span>${d.hostname||"—"}</span></div>
    <div class="info-row"><span>Last seen</span><span>${lastSeenStr}</span></div>
    <div class="info-row"><span>Agent</span><span>${d.agent_version||"—"}</span></div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="sendCommand('${d.device_id}','ping')">Ping</button>
      <button class="btn btn-muted"   onclick="sendCommand('${d.device_id}','location')">📍 Locate</button>
      <button class="btn btn-warn"    onclick="sendCommand('${d.device_id}','lock')">🔒 Lock</button>
      <button class="btn btn-danger"  onclick="openNukeModal('${d.device_id}')">🔥 Nuke</button>
    </div>
    ${nukeActive?nukePanel(d.device_id):""}
  </div>`;
}
function nukePanel(deviceId){
  const cd=nukeCountdowns[deviceId];
  if(!cd||!cd.active)return"";
  const pct=Math.round((cd.remaining/cd.total)*100);
  const m=Math.floor(cd.remaining/60),s=cd.remaining%60;
  return `<div class="nuke-panel"><h2>🔥 WIPE ARMED</h2>
    <div class="countdown">${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}</div>
    <div class="countdown-bar"><div class="countdown-fill" style="width:${pct}%"></div></div>
    <button class="btn btn-ok" style="width:100%" onclick="abortNuke('${deviceId}')">🛑 ABORT WIPE</button>
  </div>`;
}
async function checkNukeStatus(deviceId){
  const res=await apiFetch(`/nuke/status/${deviceId}`);
  if(!res.ok)return;
  const data=await res.json();
  if(data.active&&!data.aborted&&!data.executed){
    nukeCountdowns[deviceId]={active:true,remaining:data.remaining_seconds,total:data.countdown_seconds};
    startCountdownTick(deviceId);
  }else{nukeCountdowns[deviceId]={active:false};}
}
function startCountdownTick(deviceId){
  if(nukeCountdowns[deviceId]?.tickRunning)return;
  nukeCountdowns[deviceId].tickRunning=true;
  const tick=setInterval(()=>{
    const cd=nukeCountdowns[deviceId];
    if(!cd||!cd.active||cd.remaining<=0){clearInterval(tick);return;}
    cd.remaining--;
    const card=document.getElementById(`card-${deviceId}`);
    if(card){
      const fill=card.querySelector(".countdown-fill");
      const disp=card.querySelector(".countdown");
      if(fill)fill.style.width=Math.round((cd.remaining/cd.total)*100)+"%";
      if(disp){const m=Math.floor(cd.remaining/60),s=cd.remaining%60;disp.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;}
    }
  },1000);
}
function openNukeModal(deviceId){
  nukeTargetDevice=deviceId;
  ["nukeStep1","nukeStep2","nukeStep3"].forEach((id,i)=>document.getElementById(id).style.display=i===0?"block":"none");
  document.getElementById("nukeErr").textContent="";
  document.getElementById("nukeModal").classList.add("open");
}
function closeNukeModal(){document.getElementById("nukeModal").classList.remove("open");nukeTargetDevice="";}
async function nukeStep(step){
  let value;
  if(step===1)value=document.getElementById("nukePassphrase").value;
  if(step===2)value=document.getElementById("nukeConfirm").value;
  if(step===3)value=document.getElementById("nukeTotp").value;
  const res=await apiFetch("/nuke/init","POST",{device_id:nukeTargetDevice,step,value});
  const data=await res.json();
  if(!res.ok){document.getElementById("nukeErr").textContent=data.detail||"Error";return;}
  document.getElementById("nukeErr").textContent="";
  if(step<3){document.getElementById(`nukeStep${step}`).style.display="none";document.getElementById(`nukeStep${step+1}`).style.display="block";}
  else{closeNukeModal();toast(`🔥 NUKE ARMED for ${nukeTargetDevice} — 10 min countdown`,"warn");checkNukeStatus(nukeTargetDevice);}
}
async function abortNuke(deviceId){
  if(!confirm(`Abort wipe for ${deviceId}?`))return;
  const res=await apiFetch("/nuke/abort","POST",{device_id:deviceId});
  const data=await res.json();
  if(res.ok){toast(`✅ Aborted for ${deviceId}`,"ok");nukeCountdowns[deviceId]={active:false};loadDevices();}
  else toast(`❌ ${data.detail}`,"err");
}
function toast(msg,type="ok"){
  const el=document.getElementById("toast");
  el.textContent=msg;
  el.style.borderColor=type==="ok"?"var(--ok)":type==="warn"?"var(--warn)":"var(--danger)";
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),3500);
}
</script>
</body>
</html>
